<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>펭귄 데이터로 배우는 인공지능</title>
  <meta name="description" content="웹 크롤링으로 펭귄 데이터를 모으고, 결측치와 이상치를 찾아 전처리한 다음, k-최근접 이웃·의사결정 트리·선형 회귀·k-평균을 의사코드와 그림으로 배우는 고등학생용 인공지능 학습 사이트">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐧</text></svg>">
  <link rel="stylesheet" href="./src/styles/tokens.css">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/layout.css">
  <link rel="stylesheet" href="./src/styles/components.css">
  <link rel="stylesheet" href="./src/styles/viz.css">
  <link rel="stylesheet" href="./src/styles/learn.css">
  <link rel="stylesheet" href="./src/styles/slides.css">
  <link rel="stylesheet" href="./src/styles/shell.css">
</head>
<body>
  <div class="app">
    <!-- 맨 위 줄: 📚 목차 · 단원 · 쪽 · 🎯 · 장 칩 · 📖 용어 · ⋯ -->
    <header class="topnav" id="topnav" aria-label="맨 위 줄"></header>

    <!-- 무대: 한 번에 장 하나(슬라이드, 단계 실행 작업대, 또는 이 장의 장면 덩어리) -->
    <main class="workspace" id="workspace" data-layout="view">
      <!-- 방금 자막: 방금 무슨 일이 일어났나(단계 실행 쪽에서만) -->
      <div class="caption" id="caption" aria-live="polite"></div>
      <section class="panel panel--code" id="panel-code" aria-label="의사코드"></section>
      <section class="panel panel--stage" id="panel-stage" aria-label="그림"></section>
      <section class="panel panel--data" id="panel-data" aria-label="자료구조"></section>
      <section class="panel panel--view" id="panel-view" aria-label="학습 화면"></section>
      <!-- 도입·읽기·확인·정리 슬라이드(장면 위에 겹친다) -->
      <section class="slidecard" id="slidecard" aria-label="장"></section>
    </main>

    <!-- 지금 할 일 줄: 할 일 한 가지와 파란 단추 하나 -->
    <footer class="nowbar" id="nowbar" role="region" aria-label="지금 할 일">
      <div class="nowbar__player" role="group" aria-label="실행 제어"></div>
    </footer>
  </div>
  <noscript><p style="padding:16px">이 사이트는 자바스크립트를 켜야 쓸 수 있어요. 브라우저 설정에서 자바스크립트를 켜 주세요.</p></noscript>
  <script type="module" src="./src/app/main.js"></script>
</body>
</html>
